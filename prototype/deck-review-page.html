<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck review page</title>
<!-- Throwaway prototype for les-cabochons/ajour#598. Never merges. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Ajour light tokens, copied from apps/web/src/styles.css */
:root {
  --background: oklch(1 0 0);
  --foreground: oklch(0.17 0.006 285);
  --popover: oklch(1 0 0);
  --primary: oklch(0.52 0.19 285);
  --primary-fill: var(--primary);
  --secondary: oklch(0.965 0.002 285);
  --muted-foreground: oklch(0.52 0.012 285);
  --destructive: oklch(0.577 0.245 27.325);
  --warning: oklch(0.66 0.16 60);
  --success: oklch(0.6 0.16 150);
  --border: oklch(0.915 0.004 285);
  --border-row: color-mix(in srgb, var(--border) 70%, transparent);
  --ring: oklch(0.62 0.17 285);
  --sidebar: oklch(0.975 0.002 285);
  --surface-tint: oklch(0.985 0.002 285);
  --surface-highest: oklch(0.935 0.003 285);
  --text-secondary: var(--muted-foreground);
  --text-tertiary: oklch(0.62 0.01 285);
  --indigo-muted: color-mix(in srgb, var(--primary) 12%, transparent);
  --hover-bg: color-mix(in srgb, var(--foreground) 4.5%, transparent);
  --highlight-bg: color-mix(in srgb, var(--foreground) 3%, transparent);
  --app-sidebar-active-bg: color-mix(in srgb, var(--foreground) 7%, transparent);
  --field-border: color-mix(in srgb, var(--border) 84%, var(--foreground) 10%);
  --shadow-popup: 0 12px 28px color-mix(in srgb, var(--foreground) 10%, transparent), 0 2px 6px color-mix(in srgb, var(--foreground) 6%, transparent);
  --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px;
  --text-2xs: 11px; --text-xs: 12px; --text-sm: 13px; --text-base: 14px; --text-lg: 16px; --text-xl: 20px;
  --control-height: 28px; --control-height-lg: 32px;
  --page-gutter: 24px;
  --side-panel-width: 340px;
  --font-sans: "Geist", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  --diff-add: color-mix(in srgb, var(--success) 9%, transparent);
  --diff-add-no: color-mix(in srgb, var(--success) 15%, transparent);
  --diff-del: color-mix(in srgb, var(--destructive) 8%, transparent);
  --diff-del-no: color-mix(in srgb, var(--destructive) 13%, transparent);
  --stage-h: 700px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); font-size: var(--text-sm); line-height: 1.45; color: var(--foreground); background: #dcdce3; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:disabled { cursor: default; opacity: .55; }
textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
code, .mono { font-family: var(--font-mono); }
svg { flex: none; }

/* ---------- Prototype chrome (not part of the design) ---------- */
.proto { flex: none; height: 44px; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: #1c1c21; color: #e6e6ea; font-size: 12px; overflow-x: auto; white-space: nowrap; }
.proto b { font-weight: 600; color: #fff; }
.proto .grp { display: flex; align-items: center; gap: 6px; }
.proto .lab { color: #9a9aa6; }
.pseg { display: inline-flex; background: #2e2e35; border-radius: 6px; padding: 2px; gap: 2px; }
.pseg button { height: 24px; padding: 0 10px; border-radius: 4px; color: #b8b8c2; font-weight: 500; }
.pseg button.on { background: #fff; color: #1c1c21; }
.proto .notes-btn { margin-left: auto; height: 26px; padding: 0 10px; border-radius: 6px; background: #2e2e35; color: #e6e6ea; }
.notes { flex: none; max-height: 30vh; overflow: auto; background: #fffbea; border-bottom: 1px solid #eadfae; padding: 10px 16px 12px; font-size: 12px; line-height: 1.5; color: #3a3520; }
.notes h2 { font-size: 13px; margin: 0 0 6px; }
.notes .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 4px 24px; }
.notes dt { font-weight: 600; margin-top: 4px; }
.notes dd { margin: 0; }
.stage { flex: 1; min-height: 0; display: flex; justify-content: center; }
.stage.is-narrow { padding: 10px 0; }

/* ---------- App frame ---------- */
.frame { position: relative; display: flex; width: 100%; height: 100%; background: var(--background); overflow: hidden; }
.frame.narrow { width: 420px; flex-direction: column; border-radius: 10px; box-shadow: 0 6px 30px rgb(0 0 0 / 18%); }
.appnav { width: 200px; flex: none; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 1px; padding: 8px; }
.dock { height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 8px; margin-bottom: 8px; color: var(--text-secondary); }
.dock .val { margin-left: auto; }
.navrow { height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: var(--radius-md); color: var(--text-secondary); font-weight: 500; }
.navrow.on { background: var(--app-sidebar-active-bg); color: var(--foreground); }
.navsec { margin: 14px 8px 4px; font-size: var(--text-2xs); font-weight: 500; color: var(--text-secondary); }
.navpr { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: var(--radius-md); color: var(--foreground); overflow: hidden; white-space: nowrap; }
.navpr span:last-child { overflow: hidden; text-overflow: ellipsis; }
.navpr.on { background: var(--app-sidebar-active-bg); }
.workspace { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.topbar { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 var(--page-gutter); border-bottom: 1px solid var(--border); background: var(--background); }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--text-base); color: var(--text-secondary); white-space: nowrap; }
.crumbs .sep { color: var(--text-tertiary); }
.crumbs .cur { color: var(--foreground); font-weight: 600; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumbs .ttl { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumbs a, .crumbs button { color: inherit; text-decoration: none; }
.crumbs .layer { height: 24px; padding: 0 6px; border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text-secondary); display: inline-flex; align-items: center; }
.crumbs .layer:hover { background: var(--hover-bg); }
.crumbs .layer.on { background: var(--app-sidebar-active-bg); color: var(--foreground); }
.tb-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none; }
.page { flex: 1; min-height: 0; display: flex; position: relative; }
.scroll { flex: 1; min-width: 0; overflow: auto; }
.bottomnav { flex: none; height: 54px; border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 8px; background: var(--background); }
.bottomnav .seg { height: 44px; padding: 3px; }
.bottomnav .seg button { height: 38px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Controls ---------- */
.btn { height: var(--control-height); padding: 0 10px; border-radius: var(--radius-md); display: inline-flex; align-items: center; gap: 6px; font-weight: 500; border: 1px solid var(--border); background: var(--background); white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--hover-bg); }
.btn.primary { background: var(--primary-fill); border-color: transparent; color: #fff; }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--primary-fill) 88%, black); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--destructive); }
.btn.lg { height: var(--control-height-lg); }
.btn .count { font-family: var(--font-mono); font-size: var(--text-xs); padding: 0 5px; border-radius: 4px; background: rgb(255 255 255 / 22%); }
.btn:not(.primary) .count { background: var(--secondary); }
.ibtn { width: 28px; height: 28px; border-radius: var(--radius-md); display: inline-grid; place-items: center; color: var(--text-secondary); flex: none; }
.ibtn:hover { background: var(--hover-bg); color: var(--foreground); }
.ibtn.sm { width: 24px; height: 24px; }
.seg { display: inline-flex; height: 28px; padding: 2px; gap: 2px; border-radius: var(--radius-md); background: var(--secondary); flex: none; }
.seg button { height: 24px; padding: 0 10px; border-radius: var(--radius-sm); font-weight: 500; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: var(--background); color: var(--foreground); box-shadow: 0 0 0 1px var(--border); }
.chip { height: 20px; padding: 0 6px; border-radius: var(--radius-sm); font-size: var(--text-xs); font-weight: 500; display: inline-flex; align-items: center; gap: 4px; background: var(--secondary); color: var(--text-secondary); white-space: nowrap; }
.chip.accent { background: var(--indigo-muted); color: var(--primary); }
.val { font-family: var(--font-mono); font-size: var(--text-xs); white-space: nowrap; }
.plus { color: var(--success); }
.minus { color: var(--destructive); }
.muted { color: var(--text-secondary); }
.faint { color: var(--text-tertiary); }
.xs { font-size: var(--text-xs); }
.sh { font-size: var(--text-xs); font-weight: 500; color: var(--text-secondary); }
.link { color: var(--primary); }
.link:hover { text-decoration: underline; }
.spacer { flex: 1; }
.result { display: inline-flex; align-items: center; gap: 4px; font-size: var(--text-xs); color: var(--text-secondary); }
.avatar { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9px; font-weight: 600; background: var(--surface-highest); color: var(--foreground); flex: none; }
.avatar.me { background: var(--indigo-muted); color: var(--primary); }
.cn { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--field-border); display: inline-grid; place-items: center; font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--foreground); flex: none; }
.cn.on { border-color: var(--primary); color: var(--primary); }
.cn.done { background: var(--foreground); border-color: var(--foreground); color: var(--background); }
.checkbox { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--field-border); display: inline-grid; place-items: center; flex: none; background: var(--background); }
.checkbox.on { background: var(--primary-fill); border-color: var(--primary-fill); color: #fff; }

/* ---------- Object header ---------- */
.objhead { padding: 20px var(--page-gutter) 0; }
.back { font-size: var(--text-xs); color: var(--text-secondary); display: inline-flex; align-items: center; gap: 4px; }
.objtitle { font-size: var(--text-xl); font-weight: 600; line-height: 1.3; margin: 6px 0 6px; }
.objtitle .val { font-size: var(--text-xl); font-weight: 400; color: var(--text-tertiary); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: var(--text-xs); color: var(--text-secondary); }
.meta b { color: var(--foreground); font-weight: 500; }
.branch { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--foreground); background: var(--secondary); padding: 1px 6px; border-radius: var(--radius-sm); }
.figures { display: flex; flex-wrap: wrap; gap: 12px 32px; margin-top: 16px; }
.fig .l { font-size: var(--text-xs); color: var(--text-secondary); }
.fig .v { font-family: var(--font-mono); font-size: var(--text-lg); }
.proto-note { margin-top: 8px; font-size: var(--text-xs); color: var(--warning); }
.prose { max-width: 680px; }
.prose h3 { font-size: var(--text-sm); font-weight: 600; margin: 14px 0 4px; }
.prose p, .prose ul { margin: 0 0 6px; }
.prose ul { padding-left: 18px; }
.prose code { font-size: var(--text-xs); background: var(--secondary); padding: 0 4px; border-radius: var(--radius-sm); }
.clamp { max-height: 88px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }

/* ---------- Stack ---------- */
.stackstrip { display: flex; align-items: center; gap: 6px; margin-top: 14px; height: 32px; font-size: var(--text-xs); min-width: 0; }
.stackstrip .lbl { color: var(--text-secondary); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; flex: none; }
.lay { height: 24px; max-width: 260px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: var(--radius-sm); border: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; overflow: hidden; min-width: 0; }
.lay .t { overflow: hidden; text-overflow: ellipsis; }
.lay:hover { background: var(--hover-bg); }
.lay.on { border-color: var(--primary); color: var(--foreground); background: var(--indigo-muted); }
.lay.base { border-style: dashed; }
.stackarrow { color: var(--text-tertiary); flex: none; }
.stacklist { list-style: none; margin: 0; padding: 0; position: relative; }
.stacklist li { position: relative; padding-left: 22px; }
.stacklist li::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 1px; background: var(--border); }
.stacklist li:first-child::before { top: 14px; }
.stacklist li:last-child::before { bottom: calc(100% - 14px); }
.stacklist .dot { position: absolute; left: 2px; top: 10px; width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--field-border); background: var(--background); }
.stacklist li.on .dot { background: var(--primary); border-color: var(--primary); }
.stacklist button { display: block; width: 100%; padding: 4px 8px; border-radius: var(--radius-md); min-height: 28px; }
.stacklist button:hover { background: var(--hover-bg); }
.stacklist li.on button { background: var(--app-sidebar-active-bg); }
.stacklist .st { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stacklist .ss { display: block; font-size: var(--text-xs); color: var(--text-secondary); }

/* ---------- Tabs and toolbars ---------- */
.tabs { display: flex; gap: 18px; padding: 0 var(--page-gutter); border-bottom: 1px solid var(--border); margin-top: 12px; height: 40px; align-items: stretch; }
.tabs button { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; color: var(--text-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--foreground); border-bottom-color: var(--foreground); }
.toolbar { position: sticky; top: 0; z-index: 3; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 var(--page-gutter); background: var(--background); border-bottom: 1px solid var(--border); }
.source { font-size: var(--text-xs); color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* ---------- Tree (variant A) ---------- */
.filesgrid { display: grid; grid-template-columns: 272px minmax(0, 1fr); }
.tree { position: sticky; top: 44px; align-self: start; height: calc(var(--stage-h) - 48px - 44px); overflow: auto; border-right: 1px solid var(--border); padding: 8px 8px 24px 16px; }
.trow { height: 28px; width: 100%; display: flex; align-items: center; gap: 6px; padding: 0 6px; border-radius: var(--radius-md); white-space: nowrap; min-width: 0; }
.trow:hover { background: var(--hover-bg); }
.trow .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.trow.tconcern { font-weight: 500; margin-top: 6px; }
.trow.file { padding-left: 32px; color: var(--text-secondary); }
.trow.file .dir { color: var(--text-tertiary); }
.trow .val { margin-left: auto; }
.trow .cmt { color: var(--text-tertiary); display: inline-flex; align-items: center; gap: 2px; }
.difflane { padding: 16px var(--page-gutter) 80px; min-width: 0; }

/* ---------- Concerns and hunks ---------- */
.concern { margin-bottom: 28px; scroll-margin-top: 52px; }
.chead { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0 12px; }
.chead .cn { margin-top: 1px; }
.ctext { min-width: 0; flex: 1; }
.ctitle { font-size: var(--text-base); font-weight: 600; }
.cwhy { font-size: var(--text-xs); color: var(--text-secondary); margin-top: 2px; }
.cside { display: flex; align-items: center; gap: 6px; flex: none; margin-top: 1px; }
.kind { margin-left: 6px; vertical-align: 1px; }
.filehead { display: flex; align-items: center; gap: 8px; padding: 6px 0 8px; font-family: var(--font-mono); font-size: var(--text-xs); scroll-margin-top: 52px; }
.hunk { border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 10px; overflow: hidden; scroll-margin-top: 56px; background: var(--background); }
.hhead { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; background: var(--surface-tint); border-bottom: 1px solid var(--border); font-size: var(--text-xs); min-width: 0; }
.hpath { font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hpath .dir { color: var(--text-tertiary); }
.hfn { font-family: var(--font-mono); color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.viewed { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px; border-radius: var(--radius-sm); color: var(--text-secondary); flex: none; }
.viewed:hover { background: var(--hover-bg); }
.hunk.is-viewed .hbody { display: none; }
.hunk.is-viewed .hhead { border-bottom: 0; }
.hbody { font-family: var(--font-mono); font-size: var(--text-xs); line-height: 20px; }
.ln { display: flex; position: relative; }
.ln .no { flex: none; width: 40px; padding-right: 8px; text-align: right; color: var(--text-tertiary); user-select: none; }
.ln .no.one { display: none; }
.ln .sg { flex: none; width: 18px; text-align: center; user-select: none; color: var(--text-tertiary); }
.ln .code { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; padding-right: 12px; }
.ln.add { background: var(--diff-add); }
.ln.add .no { background: var(--diff-add-no); }
.ln.add .sg { color: var(--success); }
.ln.del { background: var(--diff-del); }
.ln.del .no { background: var(--diff-del-no); }
.ln.del .sg { color: var(--destructive); }
.addc { position: absolute; left: 62px; top: 1px; width: 18px; height: 18px; border-radius: 4px; background: var(--primary-fill); color: #fff; display: none; place-items: center; font-family: var(--font-sans); font-size: 14px; line-height: 1; }
.ln:hover .addc, .addc:focus-visible { display: grid; }
.ln.has-composer { box-shadow: inset 2px 0 var(--primary); }

/* ---------- Threads, drafts, composer ---------- */
.thread { margin: 6px 12px 8px 98px; border: 1px solid var(--border); border-radius: var(--radius-md); font-family: var(--font-sans); font-size: var(--text-sm); line-height: 1.45; background: var(--background); }
.thread.draft { border-color: color-mix(in srgb, var(--primary) 35%, var(--border)); }
.cm { padding: 8px 10px; }
.cm + .cm { border-top: 1px solid var(--border-row); }
.cmh { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--text-secondary); }
.cmh b { color: var(--foreground); font-weight: 500; }
.cmh .acts { margin-left: auto; display: flex; gap: 2px; }
.cm p { margin: 4px 0 0 26px; }
.tfoot { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-top: 1px solid var(--border-row); }
.composer { margin: 6px 12px 8px 98px; border: 1px solid var(--primary); border-radius: var(--radius-md); padding: 8px; font-family: var(--font-sans); font-size: var(--text-sm); background: var(--background); }
.composer textarea, .field { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--field-border); border-radius: var(--radius-sm); padding: 6px 8px; background: var(--background); line-height: 1.45; }
.composer textarea { border: 0; padding: 2px 2px; min-height: 52px; outline: none; }
.crow { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.crow .xs { flex: 1; min-width: 0; }

/* ---------- Draft review bar (variant B) ---------- */
.draftbar { position: sticky; bottom: 0; z-index: 4; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 var(--page-gutter); background: var(--background); border-top: 1px solid var(--border); }
.draftbar .what { font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Variant B layout ---------- */
.docgrid { display: grid; grid-template-columns: minmax(0, 880px) 220px; gap: 40px; padding: 0 var(--page-gutter) 40px; justify-content: start; }
.doc .objhead { padding: 20px 0 0; }
.rail { position: sticky; top: 20px; align-self: start; padding-top: 24px; }
.rail .item { width: 100%; display: flex; gap: 8px; align-items: flex-start; padding: 5px 6px; border-radius: var(--radius-md); font-size: var(--text-xs); color: var(--text-secondary); }
.rail .item:hover { background: var(--hover-bg); }
.rail .item.on { color: var(--foreground); background: var(--app-sidebar-active-bg); }
.rail .item .t { flex: 1; min-width: 0; line-height: 1.35; }
.rail .cn { width: 18px; height: 18px; font-size: 10px; }
.section { margin-top: 28px; }
.sectionrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 28px; margin-bottom: 10px; }
.toc { list-style: none; margin: 0 0 24px; padding: 0; border-top: 1px solid var(--border-row); }
.toc li button { width: 100%; display: flex; align-items: center; gap: 10px; height: 36px; border-bottom: 1px solid var(--border-row); padding: 0 4px; }
.toc li button:hover { background: var(--hover-bg); }
.toc .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.timeline { list-style: none; padding: 0; margin: 0; }

/* ---------- Layout D · Chat and quiet asks (#642, #643, #644) ---------- */
.btn.on { background: var(--app-sidebar-active-bg); border-color: transparent; }
.dwrap { position: relative; }
/* Concern "more ›": one per concern, faint until the header is hovered. */

.chatfoot { flex: none; padding: 8px 10px 10px; border-top: 1px solid var(--border); }

  if (S.tap) { mark(S.tap.h, S.tap.l, S.tap.l); return; }

  frame.innerHTML = shell(v);

  document.documentElement.style.setProperty("--stage-h", frame.clientHeight + "px");
  frame.querySelectorAll("[data-scroll]").forEach((el) => { if (scrolls[el.dataset.scroll] != null) el.scrollTop = scrolls[el.dataset.scroll]; });

  if (ds) syncSelTb();

document.addEventListener("selectionchange", () => { if (S.sel && S.sel.via === "drag" && getSelection().isCollapsed) { S.sel = null; syncSelTb(); } });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (S.dialog || S.menu || S.sheet || S.stackOpen || S.chord || S.rgPos) { S.dialog = S.menu = S.sheet = S.chord = S.rgPos = S.pendingAsk = null; S.stackOpen = false; } else if (S.sel || S.tap) { clearSel(); return; } else if (S.composer) S.composer = null; else if (S.chatOpen && S.variant === "D") S.chatOpen = false; else return; render(); return; }
  if (e.target.id === "chat-ta" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ACT.chatSend(); render(); return; }
  if (e.target.id === "rg-in" && e.key === "Enter") { e.preventDefault(); ACT.regroupGo(); render(); return; }
  if (e.target.closest("textarea, input")) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && S.composer) { ACT.saveDraft(); render(); }
    return;
  }
  if (S.variant === "C" && (e.key === "j" || e.key === "k")) { ACT.stepPick(e.key === "j" ? 1 : -1); render(); }
  if (S.variant === "D") keyD(e);
});
let chordTimer;
function keyD(e) {
  if (e.ctrlKey || e.metaKey || e.altKey || S.dialog) return;
  const k = e.key.toLowerCase();
  if (S.chord) {
    clearTimeout(chordTimer); S.chord = null; e.preventDefault();
    const votes = { c: "comment", n: S.host === "ado" ? "wait" : "changes", a: "approve" };
    if (votes[k]) { S.vote = votes[k]; S.dialog = "submit"; }
    else if (k === "y") { S.vote = "approve"; ACT.submit(); }
    render(); return;
  }
  if (e.key === "?") { S.dialog = "keys"; S.stackOpen = false; render(); return; }
  if (S.sel && (k === "e" || k === "c" || k === "a")) { e.preventDefault(); ACT[{ e: "selExplain", c: "selComment", a: "selAsk" }[k]](); render(); return; }
  if (k === "a") { e.preventDefault(); ACT.chat(); render(); return; }
  if (k === "j" || k === "k") { e.preventDefault(); stepSection(k === "j" ? 1 : -1); return; }
  if (k === "f") { if (narrow()) S.sheet = S.sheet === "dtree" ? null : "dtree"; else S.railOpen = !S.railOpen; render(); return; }
  if (k === "s") { toggleStack(); render(); return; }
  if (k === "r") { S.chord = "r"; S.stackOpen = false; S.menu = null; chordTimer = setTimeout(() => { S.chord = null; render(); }, 2500); render(); }
}
let hotKey = null;
document.addEventListener("mouseover", (e) => {
  if (S.variant !== "D" || !document.getElementById("gutter")) return;
  const c = e.target.closest(".fcard, .ln.anch");
  const k = c ? c.dataset.anchor || c.dataset.line : null;
  if (k === hotKey) return;
  hotKey = k;
  document.querySelectorAll(".hot").forEach((x) => x.classList.remove("hot"));
  if (k) document.querySelectorAll(`[data-anchor="${k}"], [data-line="${k}"]`).forEach((x) => x.classList.add("hot"));
});
let wasFloating = null;
addEventListener("resize", () => {
  document.documentElement.style.setProperty("--stage-h", document.getElementById("frame").clientHeight + "px");
  if (S.variant !== "D") return;
  if (floating() !== wasFloating) render(); else layoutGutter();
  wasFloating = floating();
});
// Deep link for reviews and headless checks: #layout=D&host=ado&width=narrow
(() => {
  const q = new URLSearchParams(location.hash.slice(1));
  if (["A", "B", "C", "D"].includes(q.get("layout"))) S.variant = q.get("layout");
  if (["github", "ado"].includes(q.get("host"))) S.host = q.get("host");
  if (["wide", "narrow"].includes(q.get("width"))) S.width = q.get("width");
  if (q.get("notes") === "0") S.notes = false;
})();
S.asks["chat:1"] = { status: "done", toks: tokens(SEED_ANSWER()), n: Infinity, clone: true };
render();
wasFloating = floating();
if (document.fonts) document.fonts.ready.then(() => { if (S.variant === "D") layoutGutter(); });
</script>
