name: Docs

# Builds the VitePress site in apps/docs. Pull requests only build it, so a
# broken page or dead link fails the check. Pushes to main also publish it to
# GitHub Pages at https://docs.ajour.day/.
on:
  push:
    branches:
      - main
    paths:
      - apps/docs/**
      - pnpm-lock.yaml
      - .github/workflows/docs-pages.yml
  pull_request:
    paths:
      - apps/docs/**
      - pnpm-lock.yaml
      - .github/workflows/docs-pages.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer push waits instead of cancelling a
# deployment that already started.
concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      # Only the docs package: the desktop app's Electron download is not needed.
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --filter @ajour/docs

      - name: Build site
        run: corepack pnpm --filter @ajour/docs build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
