name: CLI release

on:
  pull_request:
    paths:
      - apps/cli/**
      - .github/workflows/cli-release.yml
      - .github/workflows/desktop-*-release.yml
      - pnpm-lock.yaml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      tag:
        type: string
        required: true
      sign:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  binary:
    name: CLI ${{ matrix.os }} ${{ matrix.arch }} -V
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: x64, runner: windows-latest }
          - { os: macos, arch: arm64, runner: macos-15 }
          - { os: macos, arch: x64, runner: macos-15-intel }
          - { os: linux, arch: x64, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Bundle CLI and build SEA
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node apps/cli/scripts/bundle.mjs
          node apps/cli/scripts/sea.mjs
      - name: Sign and notarize macOS CLI
        if: inputs.sign && runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node apps/cli/scripts/sign-macos.mjs
      - name: Sign Windows CLI
        if: inputs.sign && runner.os == 'Windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) { throw 'Windows CLI signing requires WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD.' }
          $certFile = Join-Path $env:RUNNER_TEMP 'ajour-cli.pfx'
          try {
            [IO.File]::WriteAllBytes($certFile, [Convert]::FromBase64String($env:WIN_CSC_LINK))
            $password = ConvertTo-SecureString $env:WIN_CSC_KEY_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $certFile -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $result = Set-AuthenticodeSignature -FilePath apps/cli/out/ajour.exe -Certificate $cert -HashAlgorithm SHA256 -TimestampServer http://timestamp.digicert.com
            if ($result.Status -ne 'Valid') { throw "CLI signing failed: $($result.Status)" }
          } finally {
            Remove-Item -LiteralPath $certFile -Force -ErrorAction SilentlyContinue
            if ($cert) { Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force }
          }
      - name: Verify binary version
        shell: bash
        run: |
          output="$(apps/cli/out/ajour -V)"
          printf '%s\n' "$output"
          [[ "$output" =~ ^ajour\ [0-9]+\.[0-9]+\.[0-9]+ ]]
      - name: Archive CLI
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node apps/cli/scripts/archive.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-package-cli-${{ matrix.os }}-${{ matrix.arch }}
          path: apps/cli/out/archives/*
          if-no-files-found: error
