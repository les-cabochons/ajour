name: CLI completion
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A newer push to the same pull request replaces the run in progress, as in
# the Tests workflow. Runs on main are never cancelled.
concurrency:
  group: cli-completion-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  shells:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # macOS's bash runs in the Tests workflow's `macOS checks` job, which
      # holds every macOS check of a run on one runner.
      matrix:
        os: [ubuntu-latest]
        shell: [bash, zsh, fish]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Check literal task insertion after Tab
        run: corepack pnpm --filter @ajour/cli exec vitest run src/completion-shells.test.ts
        env:
          AJOUR_SHELL_TESTS: "1"
          AJOUR_TEST_SHELL: ${{ matrix.shell }}
