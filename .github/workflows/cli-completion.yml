name: CLI completion
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shells:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        shell: [bash, zsh, fish]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Check literal task insertion after Tab
        run: python3 apps/cli/scripts/check-completion.py ${{ matrix.shell }}
