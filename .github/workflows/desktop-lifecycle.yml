name: Desktop lifecycle

# The real-app check of "Ajour without its window" (#534, spec #525),
# `check:keep-running`. It builds the renderer, starts the real desktop app
# with a temp user data folder, closes its window, and runs an MCP client's
# start_timer, get_running_timer and stop_timer against the hidden window.
# It also runs the bundled CLI start/log/stop/undo against the real app,
# checking the dock, saved entry and client name in the Undo toast.
# Then it opens the window from the tray, finds the saved entry, quits from
# the tray, and checks that no process the app started outlives the quit.
#
# Both platforms run `check:cli-command` (#568, #569): the real app installs
# the ajour command, built in the job with the app's version, from a local
# fake release. Windows checks the user Path in a fresh PowerShell. macOS
# checks the signed binary through /usr/local/bin/ajour and refuses a foreign file.
#
# Windows and macOS, the systems the desktop app ships on. The `Tests`
# workflow calls this one for pull requests that can change the desktop app,
# the local API, the renderer or the packages they share, and its Plugin
# sandbox gate holds the result.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check. Empty checks the caller's commit.
        type: string
        default: ""
      macos:
        description: >-
          Run on macOS too. The Tests workflow passes false and runs the macOS
          check in its own `macOS checks` job, which holds every macOS check
          of a run on one runner.
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      macos:
        description: Run on macOS too
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  linux-cli:
    name: Linux CLI for WSL check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Build the check versions
        shell: bash
        run: |
          for version in 0.0.1 0.0.2; do
            for script in bundle sea archive; do
              RELEASE_TAG="v$version" node "apps/cli/scripts/$script.mjs"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cli-command-linux
          path: apps/cli/out/archives/*linux-x64.tar.gz

  check:
    needs: linux-cli
    name: Desktop lifecycle (${{ matrix.os == 'macos-latest' && 'macOS' || 'Windows' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The check runs Electron, so download its binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: ""
    strategy:
      # A failure on one system must not hide the result on the other.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        # Every caller but the Tests workflow runs it on macOS too.
        exclude:
          - os: ${{ inputs.macos == false && 'macos-latest' || 'none' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Electron 44 runs the app on Node 24. Fetch the newest 24.x patch
          # rather than the older one cached on the runner.
          node-version: 24
          check-latest: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm on Windows
        if: runner.os == 'Windows'
        run: npm install --global pnpm@10.7.0

      - name: Find the pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check the real macOS privileged command link
        if: runner.os == 'macOS'
        run: node apps/desktop/scripts/check-macos-command-link.mjs

      - name: Run the desktop lifecycle check
        # Windows and macOS runners have a desktop session, so Electron needs
        # no virtual display.
        shell: bash
        env:
          LOG: ${{ runner.temp }}/desktop-lifecycle.log
        run: corepack pnpm --filter @ajour/desktop check:keep-running 2>&1 | tee "$LOG"

      - name: Prepare writable command directory on macOS
        if: runner.os == 'macOS'
        run: sudo mkdir -p /usr/local/bin && sudo chown "$(id -u):$(id -g)" /usr/local/bin

      - name: Download Linux CLI archives
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: cli-command-linux
          path: apps/cli/out/archives

      - name: Install disposable WSL1 Ubuntu
        if: runner.os == 'Windows'
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 1
          set-as-default: 'false'
          wsl-shell-user: ajour-check

      - name: Configure WSL check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          wsl.exe -d Ubuntu-24.04 -u root --exec sh -c 'printf "[user]\ndefault=ajour-check\n" > /etc/wsl.conf'
          if ($LASTEXITCODE -ne 0) { throw "Could not configure the disposable Ubuntu user." }
          wsl.exe --terminate Ubuntu-24.04
          "AJOUR_CLI_CHECK_WSL_DISTRO=Ubuntu-24.04" >> $env:GITHUB_ENV
          "AJOUR_CLI_CHECK_LINUX_ARCHIVES=$env:GITHUB_WORKSPACE\apps\cli\out\archives" >> $env:GITHUB_ENV

      - name: Run the ajour command install check
        # It reuses the renderer the lifecycle check built, and builds the
        # CLI archive of the app's version with the release scripts.
        if: ${{ !cancelled() }}
        shell: bash
        env:
          LOG: ${{ runner.temp }}/cli-command.log
        run: corepack pnpm --filter @ajour/desktop check:cli-command --skip-build 2>&1 | tee "$LOG"

      - name: Upload the check's log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-lifecycle-log-${{ runner.os }}
          path: |
            ${{ runner.temp }}/desktop-lifecycle.log
            ${{ runner.temp }}/cli-command.log
          retention-days: 14
