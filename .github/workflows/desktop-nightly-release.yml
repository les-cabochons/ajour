name: Desktop Nightly Release

on:
  push:
    branches:
      - main
    # A push that only changes the docs site ships nothing in the desktop app.
    paths-ignore:
      - apps/docs/**
      - .github/workflows/docs-pages.yml

permissions:
  contents: read

jobs:
  plan:
    name: Plan nightly release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      package_version: ${{ steps.release.outputs.package_version }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Electron 44 runs the app on Node 24. Fetch the newest 24.x patch
          # rather than the older one cached on the runner.
          node-version: 24
          check-latest: true

      - name: Test release planner
        run: node --test .github/scripts/release-plan.test.mjs

      # The reservation is a ref under refs/nightly-reservations, not a tag.
      # GitHub's releases feed lists every tag and the desktop updater takes
      # the newest, so a tag pushed here would send installed apps to a
      # release without nightly.yml until this run publishes, or for good if
      # it fails. The release job creates the tag together with the release.
      - name: Reserve the next nightly tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          reservations='+refs/nightly-reservations/*:refs/nightly-reservations/*'
          git fetch --force origin "$reservations"
          final_output="$GITHUB_OUTPUT"
          candidate_output="$RUNNER_TEMP/nightly-release-output"
          published_tags_file="$RUNNER_TEMP/published-release-tags"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name' > "$published_tags_file"

          for attempt in {1..10}; do
            rm -f "$candidate_output"
            PUBLISHED_RELEASE_TAGS_FILE="$published_tags_file" \
              GITHUB_OUTPUT="$candidate_output" \
              node .github/scripts/release-plan.mjs nightly
            tag="$(sed -n 's/^tag=//p' "$candidate_output" | tail -n 1)"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.([0-9]{8})\.([1-9][0-9]*)$ && ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly-[0-9]{8}\.[0-9]{3,}$ ]]; then
              echo "Release planner returned an invalid nightly tag: $tag" >&2
              exit 1
            fi

            reservation="refs/nightly-reservations/$tag"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              if [[ "$(git rev-list -n 1 "refs/tags/$tag")" == "$RELEASE_SHA" ]]; then
                cat "$candidate_output" >> "$final_output"
                exit 0
              fi
            elif git show-ref --verify --quiet "$reservation"; then
              if [[ "$(git rev-parse "$reservation")" == "$RELEASE_SHA" ]]; then
                cat "$candidate_output" >> "$final_output"
                exit 0
              fi
            elif git update-ref "$reservation" "$RELEASE_SHA" && git push origin "$reservation"; then
              cat "$candidate_output" >> "$final_output"
              exit 0
            fi

            git update-ref -d "$reservation" 2>/dev/null || true
            git fetch --tags --force
            git fetch --force origin "$reservations"
          done

          echo "Unable to reserve a unique nightly tag after 10 attempts." >&2
          exit 1

  package:
    name: Package ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            # macOS 26 runners break electron-builder signing: it passes the
            # p12 password to set-key-partition-list instead of the temporary
            # keychain password (electron-builder PR #10101). Return to
            # macos-latest once a stable release carries that fix.
            runner: macos-15
            artifact: release-package-macos
            command: corepack pnpm make:desktop:mac
          - name: Windows
            runner: windows-latest
            artifact: release-package-windows
            command: corepack pnpm make:desktop:win
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Electron 44 runs the app on Node 24. Fetch the newest 24.x patch
          # rather than the older one cached on the runner.
          node-version: 24
          check-latest: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm on Windows
        if: runner.os == 'Windows'
        run: npm install --global pnpm@10.7.0

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Set desktop package version
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: node .github/scripts/release-plan.mjs set-package-version "$RELEASE_TAG"
        shell: bash

      - name: Write macOS notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_P8"
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/ajour-notarization.p8"

      - name: Create signed macOS distributables
        if: runner.os == 'macOS'
        env:
          AJOUR_UPDATE_CHANNEL: nightly
          AJOUR_MAC_RELEASE: "1"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/ajour-notarization.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: ${{ matrix.command }}

      - name: Remove macOS notarization key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP/ajour-notarization.p8"

      - name: Verify macOS signatures and notarization tickets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for arch in mac mac-arm64; do
            app="apps/desktop/out/make/$arch/Ajour.app"
            codesign --verify --deep --strict "$app"
            # stapler validate asks Apple's ticket service, and a dropped
            # connection fails it with error 68. Only that error is retried.
            for attempt in 1 2 3 4 5; do
              status=0
              xcrun stapler validate "$app" || status=$?
              if (( status == 0 )); then break; fi
              if (( status != 68 || attempt == 5 )); then exit "$status"; fi
              echo "stapler validate lost its connection; retrying in $(( attempt * 15 )) s." >&2
              sleep $(( attempt * 15 ))
            done
          done

      - name: Create Windows distributable
        if: runner.os == 'Windows'
        env:
          AJOUR_UPDATE_CHANNEL: nightly
        run: ${{ matrix.command }}

      - name: Check the packaged app's Electron fuses
        run: corepack pnpm --filter @ajour/desktop exec node scripts/check-fuses.cjs

      - name: Upload desktop distributable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/out/make/*.exe
            apps/desktop/out/make/*.exe.blockmap
            apps/desktop/out/make/*.dmg
            apps/desktop/out/make/*.dmg.blockmap
            apps/desktop/out/make/*.zip
            apps/desktop/out/make/*.zip.blockmap
            apps/desktop/out/make/nightly.yml
            apps/desktop/out/make/nightly-mac.yml
          if-no-files-found: error
          retention-days: 7

  # The malicious-plugin and lifecycle suites (#392) on the release's commit.
  # No release publishes unless they pass on Windows and macOS.
  plugin-sandbox:
    name: Plugin sandbox
    uses: ./.github/workflows/plugin-sandbox.yml

  cli:
    name: Package CLI
    needs: plan
    uses: ./.github/workflows/cli-release.yml
    with:
      ref: ${{ github.sha }}
      tag: ${{ needs.plan.outputs.tag }}
      sign: true
    secrets: inherit

  release:
    name: Publish nightly release
    needs:
      - plan
      - package
      - plugin-sandbox
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop distributables
        uses: actions/download-artifact@v4
        with:
          pattern: release-package-@(macos|windows)
          merge-multiple: true
          path: release-assets

      - name: Create tag and prerelease with changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
          PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          notes_args=(--generate-notes)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            notes_args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          # With assets, gh creates a draft, uploads them, then publishes it,
          # so the tag and the release appear only once nightly.yml is there.
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Ajour $RELEASE_TAG" \
            --prerelease \
            --latest=false \
            "${notes_args[@]}"

          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/nightly-reservations/$RELEASE_TAG" \
            || echo "Could not remove the reservation of $RELEASE_TAG." >&2

  upload-cli:
    name: Attach CLI archives
    needs: [plan, release, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download CLI archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-package-cli-*
          merge-multiple: true
          path: cli-assets
      - name: Attach CLI to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find cli-assets -type f -print0)
          (( ${#assets[@]} > 0 ))
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
