name: Tests

# Runs Ajour's test suites on every pull request and on every push to main.
# The unit suites (Vitest across the workspace) run on Windows and macOS, the
# two systems the desktop app ships on. The Playwright acceptance suite runs in
# Chromium on one of them.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress. Runs on
# main are never cancelled: a run in progress always finishes, though GitHub
# keeps only the newest of several queued runs.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The suites below never start Electron, so skip its ~100 MB binary download.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  unit:
    name: Unit tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # A failure on one system must not hide the result on the other.
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Electron 44 runs the app on Node 24. Fetch the newest 24.x patch
          # rather than the older one cached on the runner.
          node-version: 24
          check-latest: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm on Windows
        if: runner.os == 'Windows'
        run: npm install --global pnpm@10.7.0

      - name: Find the pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck and check module boundaries
        # Both are system-independent, so one system runs them.
        if: runner.os == 'Windows'
        run: corepack pnpm typecheck && corepack pnpm lint:boundaries

      - name: Test release planner
        run: node --test .github/scripts/release-plan.test.mjs

      - name: Run the code standards' consistency checks
        # The checks listed in docs/agents/code-standards.md, which must find
        # nothing, and the tests of the script that runs them.
        run: node --test .github/scripts/code-standards.test.mjs

      - name: Run workspace tests
        run: corepack pnpm test

  acceptance:
    name: Acceptance tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm on Windows
        if: runner.os == 'Windows'
        run: npm install --global pnpm@10.7.0

      # The acceptance web server is started through `just acceptance-server`.
      - name: Set up just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0

      - name: Find the pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: just acceptance-install

      - name: Run acceptance tests
        run: just acceptance-test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # electron:
  #   Placeholder for the real-Electron suites (the malicious-plugin and
  #   lifecycle suites of the Plugin API 4 migration, ticket #392). They will
  #   run on windows-latest and macos-latest, against fixture plugins and
  #   fixture HTTP services, and gate releases. This job is not implemented
  #   yet: add it here, next to `unit` and `acceptance`, so one workflow shows
  #   every suite a pull request must pass.
