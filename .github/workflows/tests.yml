name: Tests

# Runs Ajour's test suites on every pull request and on every push to main.
# The unit suites (Vitest across the workspace) run on Windows and macOS, the
# two systems the desktop app ships on. The Playwright acceptance suite runs in
# Chromium on one of them. The plugin sandbox check runs in Electron on both,
# for pull requests that can change what it checks.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress. Runs on
# main are never cancelled: a run in progress always finishes, though GitHub
# keeps only the newest of several queued runs.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The suites below never start Electron, so skip its ~100 MB binary download.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  unit:
    name: Unit tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # A failure on one system must not hide the result on the other.
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Electron 44 runs the app on Node 24. Fetch the newest 24.x patch
          # rather than the older one cached on the runner.
          node-version: 24
          check-latest: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm on Windows
        if: runner.os == 'Windows'
        run: npm install --global pnpm@10.7.0

      - name: Find the pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck and check module boundaries
        # Both are system-independent, so one system runs them.
        if: runner.os == 'Windows'
        run: corepack pnpm typecheck && corepack pnpm lint:boundaries

      - name: Test release planner
        run: node --test .github/scripts/release-plan.test.mjs

      - name: Run the code standards' consistency checks
        # The checks listed in docs/agents/code-standards.md, which must find
        # nothing, and the tests of the script that runs them.
        run: node --test .github/scripts/code-standards.test.mjs

      - name: Run workspace tests
        run: corepack pnpm test

  acceptance:
    name: Acceptance tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm on Windows
        if: runner.os == 'Windows'
        run: npm install --global pnpm@10.7.0

      # The acceptance web server is started through `just acceptance-server`.
      - name: Set up just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0

      - name: Find the pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: just acceptance-install

      - name: Run acceptance tests
        run: just acceptance-test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Decides whether a pull request can change what the desktop package holds,
  # and what the plugin sandbox check runs. Pushes and manual runs always
  # package. The sandbox check runs for pull requests and manual runs only: a
  # push to main starts the nightly release, which runs it on that commit
  # before it publishes, so running it here too would run all three systems
  # twice for every merge.
  desktop-changes:
    name: Desktop package changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package: ${{ steps.diff.outputs.package }}
      sandbox: ${{ steps.diff.outputs.sandbox }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Look for changes that reach the desktop package
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "package=true" >> "$GITHUB_OUTPUT"
            if [ "$EVENT" = "push" ]; then
              echo "sandbox=false" >> "$GITHUB_OUTPUT"
            else
              echo "sandbox=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE '^(apps/desktop/|\.github/workflows/|pnpm-lock\.yaml$)'; then
            echo "package=true" >> "$GITHUB_OUTPUT"
          else
            echo "package=false" >> "$GITHUB_OUTPUT"
          fi
          # The check runs main's plugin runtime, its IPC and its broker
          # transport (apps/desktop), the local API with the plugin host and
          # the broker (apps/api), and the SDK and shared packages (packages),
          # and every file that decides how they resolve and compile.
          if echo "$changed" | grep -qE '^(apps/desktop/|apps/api/|packages/|\.github/workflows/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.base\.json$|package\.json$)'; then
            echo "sandbox=true" >> "$GITHUB_OUTPUT"
          else
            echo "sandbox=false" >> "$GITHUB_OUTPUT"
          fi

  # Packages an unpacked app on both systems and reads its Electron fuses back,
  # the way the release workflows do, without publishing or signing. macOS
  # builds both architectures, because the unsigned binary is re-signed ad hoc
  # after the fuses are flipped and must still start.
  package:
    name: Package (${{ matrix.name }})
    needs: desktop-changes
    if: needs.desktop-changes.outputs.package == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Packaging needs Electron's binary, so do not skip its download as the
      # workflow-wide setting does.
      ELECTRON_SKIP_BINARY_DOWNLOAD: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm on Windows
        if: runner.os == 'Windows'
        run: npm install --global pnpm@10.7.0

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Package an unpacked app
        run: corepack pnpm --filter @ajour/desktop package

      - name: Package the arm64 app
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: corepack pnpm exec electron-builder --config=electron-builder.config.cjs --mac dir --arm64 --publish=never

      - name: Check the packaged apps' Electron fuses
        run: corepack pnpm --filter @ajour/desktop exec node scripts/check-fuses.cjs

      - name: Start the packaged binary as Node
        # Run as Node is on, so the binary runs a script without a window.
        # That shows the flipped, re-signed binary starts.
        shell: bash
        working-directory: apps/desktop/out/make
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            binary="mac-arm64/Ajour.app/Contents/MacOS/Ajour"
          else
            binary="win-unpacked/Ajour.exe"
          fi
          ELECTRON_RUN_AS_NODE=1 "./$binary" -e "console.log('node', process.version)"

  # The real-Electron suites of seam 3 (#392), the malicious-plugin and the
  # lifecycle suite, on Windows and macOS, and on Linux as informational.
  # `plugin-sandbox.yml` holds the job, which the release workflows run too.
  plugin-sandbox:
    name: Plugin sandbox
    needs: desktop-changes
    if: needs.desktop-changes.outputs.sandbox == 'true'
    uses: ./.github/workflows/plugin-sandbox.yml

  # The one check to require on pull requests. The sandbox matrix is skipped
  # for a change that cannot reach the plugin host, and a skipped job creates
  # no check runs, so requiring the matrix checks themselves would stall every
  # docs-only pull request. This job always runs: it passes when the suite was
  # skipped or passed, and fails when the suite ran and failed or was cancelled.
  plugin-sandbox-gate:
    name: Plugin sandbox gate
    needs:
      - desktop-changes
      - plugin-sandbox
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pass when the suite passed or had nothing to check
        env:
          CHANGES: ${{ needs.desktop-changes.result }}
          SANDBOX: ${{ needs.plugin-sandbox.result }}
        run: |
          echo "desktop-changes: $CHANGES, plugin-sandbox: $SANDBOX"
          if [ "$CHANGES" != "success" ]; then
            echo "The change filter did not finish, so the gate cannot tell." >&2
            exit 1
          fi
          case "$SANDBOX" in
            success | skipped) ;;
            *)
              echo "The plugin sandbox check ended as $SANDBOX." >&2
              exit 1
              ;;
          esac
